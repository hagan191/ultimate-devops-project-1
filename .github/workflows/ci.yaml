# CI for Product catalog service
name: product-catalog-service-ci
on:
    pull_request:
        branches: 
            - main
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: setup Go 1.22
           uses: actions/setup-go@v4
           with:
             go-version: 1.22

         - name: build
           run:  |
            cd src/product-catalog
            go build -o product-catalog-service main.go

         - name: unit tests
           run: |
            cd src/product-catalog
            go test -v ./...
    code-quality:
        runs-on: ubuntu-latest

        steps:
         - name: Checkout code
           uses: actions/checkout@v4
        
         - name: Run golangci-lint
           run: 
                 go install github.com/golangci/golangci-lint/cmd/golangci-lint@v156.2
                 golangci-lint run ./src/product-catalog/...

    docker:
        runs-on: ubuntu-latest

        needs: build

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: install Docker
            uses: docker/setup-buildx-action@v1

          - name: Login to Docker
            uses: docker/login-action@v2
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

          - name: docker push
            uses: docker/build-push-action@v2
            with:
              context: src/product-catalog
              file: ./src/product-catalog/Dockerfile
              push: true  
              tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{ github.run_id}}         
    updatek8s:
        runs-on: ubuntu-latest

        needs: docker

        steps:
          - name: Checkout code
            uses: actions/checkout@v4
            with:
              token: ${{ secrets.GITHUB_TOKEN }}
          -  name: Update tag in kubernetes deployment manifest
             run: | 
              sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml

          - name: commit and push changes
            run: |
                git config --global user.name "PenkeyTarun"
                git config --global user.email "tarunoneplus132@gmail.com"
                git add kubernetes/productcatalog/deploy.yaml
                git commit -m "[CI]: update product catalog image tag"
                git push orgin HEAD:main -f