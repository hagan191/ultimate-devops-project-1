name: ad-service-ci

on:
   pull_request:
      branches:
      - main
    
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup java 21
          uses: actions/setup-java@v3
          with:
            distribution: temurin
            java-version: 21
        
        - name: Grant execute permission for gradlew
          run: chmod +x src/ad-service/gradlew

        - name: Download dependencies
          run: ./gradlew downloadRepos
          working-directory: src/ad
        
        - name: Build
          run: ./gradlew installDist -PprotoSourceDir=../../pb
          working-directory: src/ad

        - name: Run unit tests
          run: ./gradlew test
          working-directory: src/ad

      
    docker:
      name: Build Docker image
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3
        
        - name: Login to DockerHub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./src/ad-service/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/ad-service:latest
    
    update-k8s:
      name: Update kubernetes mainfests
      needs: docker
      runs-on: ubuntu-latest

      steps:
        - name: checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.TOKEN }}
          
        - name: Update image tag in k8s manifests
          run: |
              sed -i "s|image: .*|image: vpk1999/adservice:${{ github.run_id }}|" kubernetes/ad/deploy.yaml

        - name: Commit and push changes
          run: |
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add kubernetes/ad/deploy.yaml
              git commit -m "Update image tag to ${{ github.run_id }}"
              git push
            
