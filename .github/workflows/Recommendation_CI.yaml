# CI for Recommendation Service

name: recommendation-ci

on:
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |  
          cd src/recommendation
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax
        run: |
          cd src/recommendation
          python -m py_compile recommendation_server.py

      - name: Run Unit Tests
        run: |
          cd src/recommendation
          python -m unittest discover || true

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd src/recommendation
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run Flake8
        run: |
          cd src/recommendation
          flake8 .

  docker:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: src/recommendation
          file: src/recommendation/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/recommendation:${{ github.run_id }}

  updatek8s:
    runs-on: ubuntu-latest

    needs: docker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Kubernetes Deployment
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/recommendation:${{ github.run_id }}|" kubernetes/recommendation/deploy.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.email "sushobhan.dutta14@gmail.com"
          git config --global user.name "Sushobhan Dutta"

          git add kubernetes/recommendation/deploy.yaml

          git commit -m "[CI]: Update recommendation image tag" || echo "No changes"

          git push origin HEAD:main